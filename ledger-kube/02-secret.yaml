# Secret = same shape as ConfigMap, but for sensitive values.
# Values are base64-encoded (NOT encrypted by default — that's a common interview
# gotcha: "is a K8s Secret secure by default?" -> No, base64 is just encoding.
# Real protection needs encryption-at-rest on etcd + RBAC restricting who can `get` secrets.
#
# To generate the base64 values yourself:
#   echo -n 'ledger_user' | base64
#   echo -n 'supersecret123' | base64
apiVersion: v1
kind: Secret
metadata:
  name: ledger-api-secret
  namespace: ledger
type: Opaque
data:
  DB_USER: bGVkZ2VyX3VzZXI=        # ledger_user
  DB_PASSWORD: c3VwZXJzZWNyZXQxMjM= # supersecret123
