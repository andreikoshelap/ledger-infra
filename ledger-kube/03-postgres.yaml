# Minimal single-replica Postgres for local learning only.
# In production you'd use a managed DB or a StatefulSet + PVC, not a bare Deployment
# (a Deployment gives no stable storage/identity guarantees across restarts).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger-postgres
  namespace: ledger
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ledger-postgres
  template:
    metadata:
      labels:
        app: ledger-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: ledger-api-config
                  key: DB_NAME
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: ledger-api-secret
                  key: DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ledger-api-secret
                  key: DB_PASSWORD
---
apiVersion: v1
kind: Service
metadata:
  name: ledger-postgres
  namespace: ledger
spec:
  selector:
    app: ledger-postgres
  ports:
    - port: 5432
      targetPort: 5432
