spring:
  application:
    name: ledger
  profiles:
    default: postman
  datasource:
    url: jdbc:h2:mem:ledgerdb;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate.format_sql: true
    show-sql: false
  flyway:
    enabled: false
    locations: classpath:db/migration
  h2:
    console:
      enabled: true

ledger:
  external-logging:
    base-url: https://httpstat.us
    path: /200
    connect-timeout-ms: 2000
    read-timeout-ms: 2000
  # Threat-observability module (see docs/threat-observability.md). All values are optional.
  security:
    enabled: true
    window: 5m
    enumeration-threshold: 5
    debit-velocity-threshold: 10
    client-error-threshold: 10
    suppression: 1h
    trust-forwarded-for: false
    # Static threat-intel feed (ip -> label). 203.0.113.0/24 is a documentation range.
    malicious-ips:
      "203.0.113.66": sample-threat-feed

---

spring:
  config:
    activate:
      on-profile: demo

ledger:
  external-logging:
    enabled: false

---

spring:
  config:
    activate:
      on-profile: prod

ledger:
  external-logging:
    enabled: true
    base-url: https://httpstat.us
    path: /200

---

spring:
  config:
    activate:
      on-profile: postman

ledger:
  external-logging:
    enabled: true
    base-url: https://postman-echo.com
    path: /status/200
